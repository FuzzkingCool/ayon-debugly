# Studio public/private addon: CI on production (authoritative release line).
name: CI Lint

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: ci-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff
        uses: astral-sh/ruff-action@v3
